name: Stage 1 Connectivity Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test FinMind connectivity
        run: |
          echo "=== FinMind ==="
          curl -s -o /tmp/finmind.json -w "HTTP_STATUS:%{http_code}\n" \
            "https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id=2330&start_date=2026-08-11&end_date=2026-08-11" \
            -H "Authorization: Bearer ${{ secrets.FINMIND_TOKEN }}"
          cat /tmp/finmind.json
          echo ""

      - name: Test Yahoo Finance connectivity
        run: |
          echo "=== Yahoo Finance ==="
          curl -s -o /tmp/yahoo.json -w "HTTP_STATUS:%{http_code}\n" \
            "https://query1.finance.yahoo.com/v8/finance/chart/2330.TW"
          head -c 300 /tmp/yahoo.json
          echo ""

      - name: Write test file and commit back to repo
        run: |
          mkdir -p test-output
          echo "Stage 1 test run at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > test-output/stage1-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-output/stage1-result.txt
          git commit -m "Stage 1 connectivity test: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
